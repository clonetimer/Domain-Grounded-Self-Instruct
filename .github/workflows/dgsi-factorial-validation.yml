name: DGSI factorial experiment manifest guard

on:
  push:
    branches:
      - docs/dgsi-2x2-preregistration-20261120
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-manifest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate preregistration and factorial manifest guard
        shell: bash
        run: |
          python -m unittest tests/test_factorial_preregistration.py -v
          python -m unittest tests/evaluation/test_factorial_manifest.py -v
