name: DGSI P5-C2 package artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - feat/p5c2-integrated-completion-20261117

permissions:
  contents: read

jobs:
  package-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Verify portable Skill package and clean-room execution
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p "test_portable_toolkit_package_build.py" -v
          python -m unittest discover -s tests -p "test_l1_c2_complete_review_kit.py" -v
          python -m unittest discover -s tests -p "test_l1_c2_source_rights_queue.py" -v
      - name: Build portable Skill ZIP
        run: |
          mkdir -p dist
          python scripts/package_dgsi_simulation_to_sft.py --output dist/dgsi-simulation-to-sft-toolkit-0.2.0-rc.1.zip
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          path = pathlib.Path("dist/dgsi-simulation-to-sft-toolkit-0.2.0-rc.1.zip")
          with zipfile.ZipFile(path) as archive:
              names = archive.namelist()
              assert len(names) == len(set(names)), "duplicate ZIP paths"
              manifest = json.loads(archive.read("PACKAGE_SHA256_MANIFEST.json"))
              assert manifest["version"] == "0.2.0-rc.1"
              assert manifest["training_authorized"] is False
              assert manifest["gold_authorized"] is False
              assert manifest["sft_export_authorized"] is False
              for item in manifest["files"]:
                  payload = archive.read(item["path"])
                  assert len(payload) == item["size_bytes"]
                  assert hashlib.sha256(payload).hexdigest() == item["sha256"]
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          pathlib.Path("dist/SHA256SUMS.txt").write_text(
              f"{digest}  {path.name}\\n", encoding="ascii"
          )
          print(f"PACKAGE={path}")
          print(f"SHA256={digest}")
          print(f"FILES={len(manifest['files'])}")
          PY
      - name: Upload portable Skill package
        uses: actions/upload-artifact@v4
        with:
          name: dgsi-simulation-to-sft-toolkit-0.2.0-rc.1
          path: |
            dist/dgsi-simulation-to-sft-toolkit-0.2.0-rc.1.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
