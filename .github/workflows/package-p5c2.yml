name: DGSI P5-C2 package artifacts

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/p5c2-integrated-completion-20261117
      - feat/p5c2-current-expert-intake-main-20261118

permissions:
  contents: read

jobs:
  package-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Verify portable Skill package and clean-room execution
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p "test_portable_toolkit_package_build.py" -v
          python -m unittest discover -s tests -p "test_l1_c2_complete_review_kit.py" -v
          python -m unittest discover -s tests -p "test_l1_c2_source_rights_queue.py" -v
          python -m unittest discover -s tests -p "test_l1_c2_current_rights_preflight.py" -v
          python -m unittest discover -s tests -p "test_l1_c2_rights_intake_audit.py" -v
          python -m unittest discover -s tests -p "test_l1_c2_expert_intake.py" -v
          python -m unittest discover -s tests -p "test_l1_c2_expert_intake_cli.py" -v
      - name: Read toolkit version
        id: toolkit
        run: |
          version=$(cat skills/dgsi-simulation-to-sft/VERSION)
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build portable Skill ZIP
        env:
          TOOLKIT_VERSION: ${{ steps.toolkit.outputs.version }}
        run: |
          mkdir -p dist
          python scripts/package_dgsi_simulation_to_sft.py --output "dist/dgsi-simulation-to-sft-toolkit-${TOOLKIT_VERSION}.zip"
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          version = pathlib.Path("skills/dgsi-simulation-to-sft/VERSION").read_text(encoding="utf-8").strip()
          path = pathlib.Path(f"dist/dgsi-simulation-to-sft-toolkit-{version}.zip")
          with zipfile.ZipFile(path) as archive:
              names = archive.namelist()
              assert len(names) == len(set(names)), "duplicate ZIP paths"
              manifest = json.loads(archive.read("PACKAGE_SHA256_MANIFEST.json"))
              assert manifest["version"] == version
              assert manifest["training_authorized"] is False
              assert manifest["gold_authorized"] is False
              assert manifest["sft_export_authorized"] is False
              for item in manifest["files"]:
                  payload = archive.read(item["path"])
                  assert len(payload) == item["size_bytes"]
                  assert hashlib.sha256(payload).hexdigest() == item["sha256"]
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          pathlib.Path("dist/SHA256SUMS.txt").write_text(
              f"{digest}  {path.name}\n", encoding="ascii", newline="\n"
          )
          print(f"PACKAGE={path}")
          print(f"SHA256={digest}")
          print(f"FILES={len(manifest['files'])}")
          PY
      - name: Upload portable Skill package
        uses: actions/upload-artifact@v4
        with:
          name: dgsi-simulation-to-sft-toolkit-${{ steps.toolkit.outputs.version }}
          path: |
            dist/dgsi-simulation-to-sft-toolkit-${{ steps.toolkit.outputs.version }}.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
